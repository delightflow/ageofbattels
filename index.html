<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Age of Battels — 지형을 칠하고 군대를 배치한 뒤 전투를 지켜보는 브라우저 전투 시뮬레이션 샌드박스. Paint a map, place armies, watch them fight.">
<meta name="theme-color" content="#11161c">
<title>Age of Battels — 전투 시뮬레이션 샌드박스</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%2311161c' width='64' height='64' rx='10'/%3E%3Cpath d='M32 8l18 7v15c0 13-8 21-18 26C22 51 14 43 14 30V15z' fill='%23d33a2c' stroke='%23e8c96a' stroke-width='3'/%3E%3Cpath d='M22 42l20-20M42 42L22 22' stroke='%23f3e6cf' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/game.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2449142721773499" crossorigin="anonymous"></script>
</head>
<body class="edit">
<canvas id="view"></canvas>

<header id="top">
  <div class="brand"><i class="crest"></i><b data-t="title"></b></div>
  <input id="mapName" type="text" maxlength="60" spellcheck="false" autocomplete="off">
  <div class="grp only-edit">
    <button id="bPresets" data-t="presets"></button>
    <button id="bNew" data-t="newMap"></button>
    <button id="bSave" data-t="saveLoad"></button>
    <button id="bUndo" class="ico" aria-label="undo">↶</button>
    <button id="bRedo" class="ico" aria-label="redo">↷</button>
  </div>
  <div class="grp only-battle">
    <button id="bPause" class="wide"></button>
    <div class="seg" id="speeds"></div>
    <button id="bRestart" data-t="restart"></button>
    <span id="clock">0:00</span>
  </div>
  <span class="spacer"></span>
  <button id="bStart" class="primary only-edit"><span class="tri">▶</span> <span data-t="start"></span></button>
  <button id="bEdit" class="primary only-battle" data-t="toEdit"></button>
  <button id="bSound" class="ico" aria-label="sound">♪</button>
  <button id="bLang" class="ico"></button>
  <button id="bHelp" class="ico" aria-label="help">?</button>
</header>

<aside id="panel" class="only-edit">
  <nav id="tabs"></nav>
  <div id="tool"></div>
  <section id="armies"></section>
</aside>
<button id="panelToggle" class="only-edit" aria-label="panel">▾</button>

<div id="hud" class="only-battle"></div>
<div id="selbar" hidden></div>
<div id="miniWrap"><canvas id="mini"></canvas></div>
<div id="modal" hidden><div class="dlg" role="dialog" aria-modal="true"></div></div>
<div id="toast"></div>

<script src="js/data.js"></script>
<script src="js/lore.js"></script>
<script src="js/scenario.js"></script>
<script src="js/sim.js"></script>
<script src="js/labcore.js"></script>
<script src="js/challenges.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
<script src="js/extra.js"></script>
</body>
</html>
